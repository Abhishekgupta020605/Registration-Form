<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form id="myForm" class="form-box">
        <h2>Registration Form</h2>

        <!-- Name -->
        <div class="input-group">
          <input type="text" id="username" name="username" required />
          <label>Name</label>
        </div>

       <!-- Phone Number -->
<div class="input-group">
  <input
    type="tel"
    id="phone"
    name="phone"
    required
    title="Enter digits only"
  />
  <label>Phone Number</label>
</div>

        <!-- Email -->
        <div class="input-group">
          <input
            type="email"
            id="email"
            name="email"
            required
            title="Email must end with @gmail.com"
          />
          <label>Email</label>
        </div>

        <!-- Password -->
        <div class="input-group">
          <input
            type="password"
            id="password"
            name="password"
            required
            title="Must contain 8+ chars, uppercase, lowercase, number & special char"
          />
          <label>Password</label>
        </div>

        <!-- Date of Birth -->
        <div class="input-group">
          <input type="date" id="dob" name="dob" required />
          <label>Date of Birth</label>
        </div>

        <!-- Subjects -->
        <div class="section">
          <p>Subjects:</p>
          <label
            ><input type="checkbox" name="subjects" value="English" />
            English</label
          >
          <label
            ><input type="checkbox" name="subjects" value="Hindi" />
            Hindi</label
          >
          <label
            ><input type="checkbox" name="subjects" value="Physics" />
            Physics</label
          >
          <label
            ><input type="checkbox" name="subjects" value="Math" /> Math</label
          >
        </div>

        <!-- Gender -->
        <div class="section">
          <p>Gender:</p>
          <label
            ><input type="radio" name="gender" value="Male" required />
            Male</label
          >
          <label
            ><input type="radio" name="gender" value="Female" required />
            Female</label
          >
        </div>

        <!-- Branch -->
        <div class="input-group">
          <select name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="CS">CS</option>
            <option value="CSE-IOT">CSE-IOT</option>
            <option value="CSE-IT">CSE-IT</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
